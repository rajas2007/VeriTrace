name: VeriTrace CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Architecture & Test Suite
    runs-on: windows-latest

    env:
      QT_QPA_PLATFORM: offscreen
      QT_DEBUG_PLUGINS: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip and install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]

      - name: Run Ruff Lint and Format Checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run Architecture Boundary Validation
        run: |
          python scripts/validation/check_architecture.py

      - name: Run Mypy Type Checking
        run: |
          mypy .

      - name: Run Desktop Bootstrap Smoke Test
        run: |
          python scripts/development/run_desktop.py

      - name: Run Pytest Suite
        run: |
          pytest -v
