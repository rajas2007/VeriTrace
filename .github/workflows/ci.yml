name: VeriTrace CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  architecture-check:
    name: Architecture & Boundary Validation
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Architecture Boundaries
        run: |
          python scripts/validation/check_architecture.py

      - name: Validate Desktop Entrypoint Smoke Test
        run: |
          python scripts/development/run_desktop.py

  unit-tests:
    name: Unit & Regression Tests
    runs-on: windows-latest
    needs: architecture-check

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Unit Tests
        run: |
          pytest -v
